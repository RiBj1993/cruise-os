<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cruise OS v3 — Data System</title>

<style>
body{margin:0;font-family:system-ui;background:#0b0b0b;color:#fff}
header{padding:14px;text-align:center;font-weight:800;background:#111}
.container{padding:12px}

.card{background:#151515;padding:12px;border-radius:12px;margin-bottom:10px;cursor:pointer}

.hidden{display:none}

.section{background:#151515;padding:12px;border-radius:12px;margin-top:10px}

.badge{font-size:11px;padding:3px 8px;border-radius:6px;display:inline-block}
.low{background:#2e7d32}
.med{background:#ef6c00}
.high{background:#b71c1c}

a{color:#4fc3f7;text-decoration:none}
button{width:100%;padding:10px;border:none;border-radius:10px;margin-top:10px;font-weight:700}
.back{background:#fff;color:#000}

.row{margin-top:6px;color:#aaa;font-size:13px}
</style>
</head>

<body>

<header>🚢 Cruise OS v3 — Structured Engine</header>

<div id="home" class="container"></div>

<div id="detail" class="container hidden">

<button class="back" onclick="back()">← Back</button>

<h2 id="title"></h2>
<p id="desc"></p>

<div class="section">
<h3>⏱ Timeline Logic</h3>
<p id="timeline"></p>
</div>

<div class="section">
<h3>🚆 Transport</h3>
<p id="transport"></p>
</div>

<div class="section">
<h3>🎟 Ticket Logic</h3>
<p id="tickets"></p>
</div>

<div class="section">
<h3>🍽 Food Strategy</h3>
<p id="food"></p>
</div>

<div class="section">
<h3>💰 Budget Estimate</h3>
<p id="budget"></p>
</div>

<div class="section">
<h3>⚠ Safety Return Rule</h3>
<p id="safety"></p>
</div>

<div class="section">
<h3>🗺 Map</h3>
<a id="map" target="_blank">Open Location</a>
</div>

</div>

<script>

const ports = {

palma:{
title:"Palma de Mallorca",
desc:"Low-stress cultural + seaside port.",
timeline:"Leave 09:30 → return buffer 20:00 latest",
transport:"Walk + taxi optional (10–15 min from port)",
tickets:"No mandatory tickets (optional cathedral €9)",
food:"Tapas old town (€20–40) | Café culture focus",
budget:"€30–60 total",
safety:"Return 2h before departure (low risk port)",
map:"https://www.google.com/maps?q=Palma+old+town"
},

valencia:{
title:"Valencia",
desc:"Balanced architecture + food city.",
timeline:"Leave 09:00 → return 15:30–16:00",
transport:"Taxi or metro (~20 min city access)",
tickets:"City of Arts optional (€10–€25)",
food:"Paella (€25–€40) near beach or central market",
budget:"€40–€80",
safety:"Moderate risk → avoid late return",
map:"https://www.google.com/maps?q=Valencia+City+of+Arts"
},

rome:{
title:"Rome (Civitavecchia)",
desc:"High intensity historical mega-city.",
timeline:"07:30 leave → 15:30 strict return",
transport:"Train (1h15 each way, €5–€10)",
tickets:"Colosseum required (€18–€25, PREBOOK only)",
food:"Trastevere lunch (€20–€35)",
budget:"€60–€100",
safety:"HIGH RISK: zero delay tolerance",
map:"https://www.google.com/maps?q=Colosseum+Rome"
},

laspezia:{
title:"La Spezia / Cinque Terre",
desc:"Train-based coastal villages.",
timeline:"08:30 leave → 13:30 return buffer",
transport:"Regional train (€18–€25 pass)",
tickets:"Cinque Terre train pass required",
food:"Street seafood (€10–€25)",
budget:"€40–€70",
safety:"Medium risk (train delays possible)",
map:"https://www.google.com/maps?q=Cinque+Terre"
}

};

// render home
const home=document.getElementById("home");

Object.keys(ports).forEach(k=>{
const p=ports[k];
home.innerHTML+=`
<div class="card" onclick="openPort('${k}')">
<b>${p.title}</b>
<div class="row">${p.desc}</div>
</div>`;
});

function openPort(k){
const p=ports[k];

document.getElementById("home").classList.add("hidden");
document.getElementById("detail").classList.remove("hidden");

document.getElementById("title").innerText=p.title;
document.getElementById("desc").innerText=p.desc;
document.getElementById("timeline").innerText=p.timeline;
document.getElementById("transport").innerText=p.transport;
document.getElementById("tickets").innerText=p.tickets;
document.getElementById("food").innerText=p.food;
document.getElementById("budget").innerText=p.budget;
document.getElementById("safety").innerText=p.safety;
document.getElementById("map").href=p.map;
}

function back(){
document.getElementById("detail").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}

</script>

</body>
</html>
