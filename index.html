<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cruise OS - Mediterranean</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{margin:0;font-family:system-ui;background:#0b0b0b;color:#fff}
header{padding:14px;text-align:center;background:#111;font-weight:700}
.container{padding:12px}

.card{background:#151515;padding:12px;border-radius:14px;margin-bottom:10px}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:10px;
background:#fff;
color:#000;
font-weight:600;
}

img{width:100%;border-radius:10px;margin-top:6px}

.badge{font-size:11px;padding:4px 8px;border-radius:6px;display:inline-block;margin-bottom:6px}
.green{background:#2e7d32}
.orange{background:#ef6c00}
.red{background:#b71c1c}

#map{height:240px;border-radius:12px;margin-top:10px}

.small{color:#aaa;font-size:12px}
</style>
</head>

<body>

<header>🚢 Cruise OS — Mediterranean Smart Guide</header>

<div class="container">

<div class="card" id="app">Loading...</div>

<button onclick="load('palma')">Palma</button>
<button onclick="load('ibiza')">Ibiza</button>
<button onclick="load('valencia')">Valencia</button>
<button onclick="load('laspezia')">La Spezia</button>
<button onclick="load('rome')">Rome</button>
<button onclick="load('savona')">Savona</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* 🚢 SHIP LOCATIONS */
const ship = {
palma:[39.55,2.65],
ibiza:[38.91,1.42],
valencia:[39.46,-0.32],
laspezia:[44.10,9.82],
rome:[41.90,12.48],
savona:[44.30,8.46]
};

/* 📍 FULL PORT DATA */
const data = {

palma:{
name:"Palma de Mallorca",
risk:"low",
time:"10:00 → 22:00",
img:"https://source.unsplash.com/800x500/?palma,mallorca",
places:[
{name:"Cathedral",img:"https://source.unsplash.com/400x300/?cathedral,spain",cost:"9€",ticket:"https://tickets.catedraldemallorca.org",coords:[39.5667,2.6483]},
{name:"Old Town",img:"https://source.unsplash.com/400x300/?oldtown,spain",cost:"Free",ticket:"",coords:[39.569,2.650]},
{name:"Beach Palma",img:"https://source.unsplash.com/400x300/?beach,spain",cost:"Free",ticket:"",coords:[39.53,2.74]}
]
},

rome:{
name:"Rome",
risk:"high",
time:"08:00 → 18:30",
img:"https://source.unsplash.com/800x500/?rome,colosseum",
places:[
{name:"Colosseum",img:"https://source.unsplash.com/400x300/?colosseum",cost:"18€",ticket:"https://ticketing.colosseo.it",coords:[41.8902,12.4922]},
{name:"Pantheon",img:"https://source.unsplash.com/400x300/?pantheon,rome",cost:"Free",ticket:"",coords:[41.8986,12.4768]},
{name:"Navona",img:"https://source.unsplash.com/400x300/?piazza,rome",cost:"Free",ticket:"",coords:[41.8992,12.4731]}
]
},

laspezia:{
name:"La Spezia",
risk:"medium",
time:"08:00 → 19:00",
img:"https://source.unsplash.com/800x500/?cinque-terre",
places:[
{name:"Monterosso",img:"https://source.unsplash.com/400x300/?cinque-terre",cost:"7–18€ train",ticket:"https://www.cinqueterre.eu.com",coords:[44.1465,9.6542]},
{name:"Vernazza",img:"https://source.unsplash.com/400x300/?vernazza",cost:"train pass",ticket:"https://www.cinqueterre.eu.com",coords:[44.134,9.684]}
]
}

};

/* 🧭 LOAD PORT */
let map;

function load(key){

const p = data[key];

document.getElementById("app").innerHTML = `

<div class="card">
<span class="badge ${p.risk==='high'?'red':p.risk==='medium'?'orange':'green'}">
${p.risk.toUpperCase()} RISK
</span>

<h2>${p.name}</h2>
<p class="small">${p.time}</p>

<img src="${p.img}">

</div>

<div class="card">
<h3>📍 Places</h3>

${p.places.map(pl=>`
<div style="margin-bottom:10px">
<img src="${pl.img}">
<b>${pl.name}</b><br>
💰 ${pl.cost}<br>

<button onclick="window.open('${pl.ticket || 'https://www.google.com/maps/search/'+pl.name}','_blank')">
🎟️ Open / Tickets
</button>
</div>
`).join("")}

</div>

<div class="card">
<h3>🗺️ Map</h3>
<div id="map"></div>
<button onclick="route(${key})">🚢 Route to ship</button>
</div>

`;

setTimeout(()=>renderMap(key,p),100);
}

function renderMap(key,p){

if(map) map.remove();

map = L.map('map').setView(ship[key],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* 🚢 ship */
L.marker(ship[key]).addTo(map).bindPopup("🚢 Ship");

/* 📍 POIs */
p.places.forEach(pl=>{
L.marker(pl.coords).addTo(map)
.bindPopup(pl.name);
});

}

function route(key){
const [lat,lng]=ship[key];
window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
}

load("palma");

</script>

</body>
</html>
