<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cruise OS App</title>

<style>
body{
margin:0;
font-family:system-ui;
background:#0b0b0b;
color:#fff;
}

header{
padding:14px;
text-align:center;
font-weight:800;
background:#111;
}

.container{
padding:12px;
}

.card{
background:#151515;
padding:12px;
border-radius:14px;
margin-bottom:10px;
cursor:pointer;
}

.hidden{display:none}

h2{margin:0 0 8px 0;font-size:18px}
p{margin:4px 0;color:#aaa;font-size:13px}

button{
padding:10px;
width:100%;
border:none;
border-radius:10px;
font-weight:700;
margin-top:10px;
}
.back{
background:#fff;
color:#000;
}
</style>
</head>

<body>

<header id="header">🚢 Cruise OS</header>

<!-- HOME -->
<div id="home" class="container">

<div class="card" onclick="openPort('palma')">
<h2>Palma</h2>
<p>Old town • cafés • beaches</p>
</div>

<div class="card" onclick="openPort('valencia')">
<h2>Valencia</h2>
<p>Paella • Arts City • old town</p>
</div>

<div class="card" onclick="openPort('rome')">
<h2>Rome</h2>
<p>Colosseum • Vatican • history</p>
</div>

<div class="card" onclick="openPort('laspezia')">
<h2>La Spezia</h2>
<p>Cinque Terre • train villages</p>
</div>

<div class="card" onclick="openPort('savona')">
<h2>Savona</h2>
<p>Relax • cafés • slow walk</p>
</div>

</div>

<!-- PORT VIEW -->
<div id="portView" class="container hidden">

<h2 id="portTitle"></h2>
<p id="portDesc"></p>

<button class="back" onclick="backHome()">← Back</button>

</div>

<script>

// 🌍 DATA LAYER (REAL APP STATE)
const ports = {
palma:{
title:"Palma de Mallorca",
desc:"Old town, cafés, tapas, beaches. Relaxed energy day."
},
valencia:{
title:"Valencia",
desc:"Paella capital, City of Arts, old town walking route."
},
rome:{
title:"Rome",
desc:"High intensity day. Colosseum, Pantheon, Vatican option."
},
laspezia:{
title:"La Spezia",
desc:"Gateway to Cinque Terre. Train-based logistics required."
},
savona:{
title:"Savona",
desc:"Calm recovery stop. Minimal planning needed."
}
};

// 🧠 ROUTER STATE
let currentPort = null;

// 🔁 OPEN PORT
function openPort(port){

currentPort = port;

document.getElementById("home").classList.add("hidden");
document.getElementById("portView").classList.remove("hidden");

document.getElementById("portTitle").innerText = ports[port].title;
document.getElementById("portDesc").innerText = ports[port].desc;

window.scrollTo(0,0);
}

// 🔙 BACK
function backHome(){
currentPort = null;

document.getElementById("home").classList.remove("hidden");
document.getElementById("portView").classList.add("hidden");
}

</script>

</body>
</html>
