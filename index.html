<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cruise OS</title>

<style>
body{
margin:0;
font-family:system-ui;
background:#0b0b0b;
color:#fff;
}

header{
padding:14px;
text-align:center;
font-weight:800;
background:#111;
}

.container{padding:12px}

.card{
background:#151515;
padding:12px;
border-radius:14px;
margin-bottom:10px;
cursor:pointer;
}

.hidden{display:none}

h2{margin:0 0 8px 0}
p{color:#aaa;font-size:13px}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
font-weight:700;
margin-top:10px;
}

.back{background:#fff;color:#000}

/* detail layout */
.section{
background:#151515;
padding:12px;
border-radius:12px;
margin-top:10px;
}

a{color:#4fc3f7;text-decoration:none}
</style>
</head>

<body>

<header>🚢 Cruise OS</header>

<!-- HOME -->
<div id="home" class="container">

<div class="card" onclick="openPort('palma')">
<h2>Palma</h2>
<p>Old town • cafés • beaches</p>
</div>

<div class="card" onclick="openPort('valencia')">
<h2>Valencia</h2>
<p>Paella • City of Arts • old town</p>
</div>

<div class="card" onclick="openPort('rome')">
<h2>Rome</h2>
<p>Colosseum • Vatican • history</p>
</div>

<div class="card" onclick="openPort('laspezia')">
<h2>La Spezia</h2>
<p>Cinque Terre • trains • villages</p>
</div>

</div>

<!-- DETAIL VIEW -->
<div id="detail" class="container hidden">

<button class="back" onclick="backHome()">← Back</button>

<h2 id="title"></h2>
<p id="desc"></p>

<div class="section">
<h3>🍽 Recommended Food</h3>
<p id="food"></p>
</div>

<div class="section">
<h3>🗺 Maps</h3>
<a id="map" target="_blank">Open Google Maps</a>
</div>

<div class="section">
<h3>🎟 Tickets</h3>
<a id="ticket" target="_blank">Buy / View Tickets</a>
</div>

<div class="section">
<h3>⏱ Timing Plan</h3>
<p id="time"></p>
</div>

</div>

<script>

const data = {

palma:{
title:"Palma de Mallorca",
desc:"Relaxed port with old town + cafés + beach options.",
food:"Ca'n Joan de S'Aigo (pastries) • La Bodeguilla (tapas)",
map:"https://www.google.com/maps/search/palma+old+town",
ticket:"https://tickets-viator.com/palma",
time:"09:30 leave → 13:30 return buffer 2h minimum"
},

valencia:{
title:"Valencia",
desc:"Balanced day: food + architecture + walking.",
food:"Casa Carmela (paella) • Mercat Central (local food)",
map:"https://www.google.com/maps/search/valencia+city+of+arts",
ticket:"https://tickets-viator.com/valencia",
time:"09:00 leave → 14:30 return"
},

rome:{
title:"Rome",
desc:"High intensity. Only 2–3 major stops possible.",
food:"Armando al Pantheon • Trastevere pasta",
map:"https://www.google.com/maps/search/rome+colosseum",
ticket:"https://tickets-viator.com/rome-colosseum",
time:"07:30 leave → 15:30 strict return buffer"
},

laspezia:{
title:"La Spezia / Cinque Terre",
desc:"Train-based logistics. Risk of delays.",
food:"Seafood cones Monterosso • Vernazza restaurants",
map:"https://www.google.com/maps/search/cinque+terre",
ticket:"https://www.italiarail.com/cinque-terre",
time:"08:30 leave → 13:30 return (NO RISK BUFFER NEEDED)"
}

};

// OPEN PORT
function openPort(p){

const d = data[p];

document.getElementById("home").classList.add("hidden");
document.getElementById("detail").classList.remove("hidden");

document.getElementById("title").innerText = d.title;
document.getElementById("desc").innerText = d.desc;

document.getElementById("food").innerText = d.food;
document.getElementById("map").href = d.map;
document.getElementById("ticket").href = d.ticket;
document.getElementById("time").innerText = d.time;

window.scrollTo(0,0);
}

// BACK
function backHome(){
document.getElementById("home").classList.remove("hidden");
document.getElementById("detail").classList.add("hidden");
}

</script>

</body>
</html>
