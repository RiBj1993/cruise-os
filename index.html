<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cruise OS v2</title>

<style>
body{
margin:0;
font-family:system-ui;
background:#0b0b0b;
color:#fff;
}

header{
padding:14px;
text-align:center;
font-weight:800;
background:#111;
}

.container{padding:12px}

.card{
background:#151515;
padding:12px;
border-radius:14px;
margin-bottom:10px;
cursor:pointer;
}

.hidden{display:none}

h2{margin:0 0 6px 0}
p{color:#aaa;font-size:13px}

.section{
background:#151515;
padding:12px;
border-radius:12px;
margin-top:10px;
}

.restaurant{
background:#1c1c1c;
padding:10px;
border-radius:10px;
margin-top:8px;
cursor:pointer;
}

.badge{
font-size:11px;
padding:3px 8px;
border-radius:6px;
display:inline-block;
margin-bottom:6px;
}

.low{background:#2e7d32}
.med{background:#ef6c00}
.high{background:#b71c1c}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
font-weight:700;
margin-top:10px;
}

.back{background:#fff;color:#000}

img{
width:100%;
border-radius:10px;
margin-top:8px;
}
</style>
</head>

<body>

<header>🚢 Cruise OS v2 — Execution System</header>

<!-- HOME -->
<div id="home" class="container">

<div class="card" onclick="openPort('palma')">
<h2>Palma</h2>
<p>Old town • cafés • beach • relaxed</p>
</div>

<div class="card" onclick="openPort('valencia')">
<h2>Valencia</h2>
<p>Paella • City of Arts • walking city</p>
</div>

<div class="card" onclick="openPort('rome')">
<h2>Rome</h2>
<p>Colosseum • Vatican • high intensity</p>
</div>

<div class="card" onclick="openPort('laspezia')">
<h2>La Spezia</h2>
<p>Cinque Terre • trains • risk-managed day</p>
</div>

</div>

<!-- DETAIL -->
<div id="detail" class="container hidden">

<button class="back" onclick="back()">← Back</button>

<h2 id="title"></h2>
<p id="desc"></p>

<div class="section">
<h3>🗺 Map</h3>
<iframe id="map" width="100%" height="200"></iframe>
</div>

<div class="section">
<h3>🍽 Restaurants</h3>
<div id="restaurants"></div>
</div>

<div class="section">
<h3>⏱ Timing + Safety</h3>
<p id="timing"></p>
</div>

</div>

<script>

const data = {

palma:{
title:"Palma de Mallorca",
desc:"Relaxed port: old town + cafés + optional beach.",
map:"https://www.google.com/maps?q=Palma+old+town&output=embed",
timing:"Leave 09:30 → Return latest 20:00 (2h buffer required)",
restaurants:[
{name:"Ca’n Joan de S’Aigo",type:"low",desc:"Traditional pastries + café"},
{name:"La Bodeguilla",type:"med",desc:"Best tapas in old town"},
{name:"Mercat de l’Olivar",type:"low",desc:"Food market, safe variety"}
]
},

valencia:{
title:"Valencia",
desc:"Balanced cultural + food day.",
map:"https://www.google.com/maps?q=Valencia+City+of+Arts&output=embed",
timing:"Leave 09:00 → Return 15:30 (moderate buffer)",
restaurants:[
{name:"Casa Carmela",type:"high",desc:"Authentic wood paella"},
{name:"La Pepica",type:"med",desc:"Beach paella classic"},
{name:"Mercado Central",type:"low",desc:"Fast food stalls"}
]
},

rome:{
title:"Rome",
desc:"High risk intensity day — plan strictly.",
map:"https://www.google.com/maps?q=Colosseum+Rome&output=embed",
timing:"Leave 07:30 → MUST return 15:30 max (strict buffer)",
restaurants:[
{name:"Armando al Pantheon",type:"high",desc:"Best carbonara"},
{name:"Trastevere local spots",type:"med",desc:"Authentic Roman food"},
{name:"Sant’Eustachio Café",type:"low",desc:"Quick espresso stop"}
]
},

laspezia:{
title:"La Spezia / Cinque Terre",
desc:"Train-based logistics — delays possible.",
map:"https://www.google.com/maps?q=Cinque+Terre&output=embed",
timing:"Leave 08:30 → Return 13:30 (low risk tolerance)",
restaurants:[
{name:"Monterosso seafood cones",type:"low",desc:"Fast street seafood"},
{name:"Vernazza cliff restaurants",type:"med",desc:"Scenic but slow"},
{name:"La Spezia station cafés",type:"low",desc:"Safe fallback option"}
]
}

};

let current=null;

function openPort(p){
current=p;
document.getElementById("home").classList.add("hidden");
document.getElementById("detail").classList.remove("hidden");

const d=data[p];

document.getElementById("title").innerText=d.title;
document.getElementById("desc").innerText=d.desc;
document.getElementById("map").src=d.map;
document.getElementById("timing").innerText=d.timing;

// restaurants
let html="";
d.restaurants.forEach(r=>{
html+=`
<div class="restaurant">
<div class="badge ${r.type}">${r.type.toUpperCase()}</div>
<b>${r.name}</b><br>
<span style="color:#aaa;font-size:12px">${r.desc}</span>
</div>`;
});

document.getElementById("restaurants").innerHTML=html;
}

function back(){
document.getElementById("detail").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}

</script>

</body>
</html>
